[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cost-per-task"
version = "0.7.0"
description = "Measure the real cost per completed task of LLM agents: capture token usage per API call, group into attempts and tasks, price them, and report cost per solved task."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OptimNow", email = "jean@optimnow.io" }]
keywords = ["finops", "llm", "agents", "cost", "tokens", "cost-per-task"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
cpt = "cost_per_task.cli:main"

[project.urls]
Homepage = "https://github.com/OptimNow/cost-per-task"
Issues = "https://github.com/OptimNow/cost-per-task/issues"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/cost_per_task"]

# The dated price tables travel with the package, so a pip install can price.
[tool.hatch.build.targets.wheel.force-include]
"prices" = "cost_per_task/prices"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
